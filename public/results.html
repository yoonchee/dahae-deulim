<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>다해드림 — 들어온 부탁</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo">다해드림</div>
        <a href="/">← 랜딩으로</a>
      </header>
      <section class="hero">
        <h1>들어온 부탁</h1>
        <p class="lead">
          전화 <a href="tel:010-3990-0935">010-3990-0935</a>로 바로 온 건은 여기 없습니다.
          페이지에서 남긴 부탁만 모입니다. 누가 부탁하는지, 어떤 일이 많은지를 봅니다.
        </p>
      </section>
      <div class="stats" id="stats"></div>
      <section class="panel">
        <h2>부탁 목록</h2>
        <p class="hint">로컬 파일에만 저장됩니다. 외부로 전송하지 않습니다.</p>
        <div id="table"></div>
      </section>
    </div>
    <script>
      const JOB_LABEL = {
        taxi: "택시",
        order: "주문",
        hospital: "병원",
        train: "기차표",
        "scam-check": "사기 확인",
      };
      const ROLE_LABEL = { child: "자녀(부모님)", self: "본인" };

      fetch("/api/stats")
        .then((r) => r.json())
        .then((data) => {
          const jobs = Object.entries(data.byJob || {})
            .sort((a, b) => b[1] - a[1])
            .map(([k, v]) => `${JOB_LABEL[k] || k} ${v}`)
            .join(" · ") || "아직 없음";

          document.getElementById("stats").innerHTML = `
            <div class="stat"><span>방문</span><b>${data.visits}</b></div>
            <div class="stat"><span>부탁</span><b>${data.signups}</b></div>
            <div class="stat"><span>전환율</span><b>${data.conversion}%</b></div>
            <div class="stat"><span>자녀 / 본인</span><b>${data.byRole.child || 0} / ${data.byRole.self || 0}</b></div>
          `;

          const rows = (data.signupsDetail || [])
            .slice()
            .reverse()
            .map((row) => {
              const when = new Date(row.at).toLocaleString("ko-KR");
              const jobsText = (row.jobs || []).map((j) => JOB_LABEL[j] || j).join(", ");
              return `<tr>
                <td>${when}</td>
                <td>${escapeHtml(row.name)}</td>
                <td>${escapeHtml(row.contact)}</td>
                <td>${ROLE_LABEL[row.role] || row.role}</td>
                <td>${jobsText}</td>
              </tr>`;
            })
            .join("");

          document.getElementById("table").innerHTML = `
            <p class="fine">가장 많이 고른 일: ${jobs}</p>
            <table>
              <thead><tr><th>시각</th><th>이름</th><th>연락처</th><th>대상</th><th>필요 도움</th></tr></thead>
              <tbody>${rows || "<tr><td colspan='5'>아직 부탁이 없습니다.</td></tr>"}</tbody>
            </table>
          `;
        })
        .catch(() => {
          document.getElementById("table").textContent = "통계를 불러오지 못했습니다.";
        });

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }
    </script>
  </body>
</html>
